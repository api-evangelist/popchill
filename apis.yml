description: PopChill is Taiwan's largest secondhand luxury fashion trading platform,
  operating as a mobile marketplace app for buying and selling authenticated pre-owned
  designer goods including handbags, watches, jewelry, apparel, and footwear from
  Chanel, Hermes, Louis Vuitton, Dior, Gucci, Prada, and 40+ other brands. The company
  provides item authentication, secure transactions, and seller support to a consumer
  audience. PopChill is backed by 500 Global. As of this enrichment pass the company
  publishes no public developer portal, API documentation, or technical integration
  surface; this profile tracks the company in the API Evangelist network pending any
  future API program.
